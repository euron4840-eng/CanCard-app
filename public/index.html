<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CanCard Prototype</title><style>body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f4f8}.card{background:white;padding:20px;margin:16px 0;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}input,button{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}button{background:#667eea;color:white;border:none;cursor:pointer;font-weight:bold}h1{color:#333}.nav{display:flex;gap:4px;margin-bottom:12px}.nav button{width:auto;padding:6px 12px;font-size:12px;background:#e9ecef;color:#333}.nav button.act{background:#667eea;color:white}.ok{background:#d4edda;color:#155724;padding:10px;border-radius:6px}.err{background:#f8d7da;color:#721c24;padding:10px;border-radius:6px}small{color:#999}</style></head><body><div class="card"><h1>CanCard</h1><small>Prototype - API Status</small></div><div class="nav" id="nav"><button class="act" onclick="show(login)">Login</button><button onclick="show(profile)">Profile</button><button onclick="show(health)">Health</button><button onclick="show(twin)">Digital Twin</button><button onclick="show(sim)">Simulation</button><button onclick="show(nfc)">NFC</button></div><div id="main"></div><script>var T=localStorage.getItem("t");async function c(m,u,b){var o={method:m,headers:{"Content-Type":"application/json"}};if(T)o.headers["Authorization"]="Bearer "+T;if(b)o.body=JSON.stringify(b);var r=await fetch(u,o);return{ok:r.ok,d:await r.json()}}function $(i){return document.getElementById(i)}function show(s){document.querySelectorAll(".nav button").forEach(function(b){b.classList.remove("act")});event.target.classList.add("act");window["show"+s]()}function showlogin(){var h="<div class=card><h2>Login</h2><input id=em placeholder=Email value=deniz.demo@cancard.app><input id=pw type=password placeholder=Password value=demo1234><button onclick=login()>Sign In</button><small>Demo pre-filled</small></div>";$("main").innerHTML=h}async function login(){var r=await c("POST","/api/auth/login",{email:$("em").value,password:$("pw").value});if(r.ok){T=r.d.token;localStorage.setItem("t",T);$("main").innerHTML="<div class=ok>Logged in as "+r.d.user.fullName+"</div>"+JSON.stringify(r.d,null,2)}else{$("main").innerHTML="<div class=err>Login failed: "+r.d.error+"</div>"}}async function showprofile(){var r=await c("GET","/api/users/DENIZ_001");$("main").innerHTML=r.ok?"<div class=card><h2>User Profile</h2><pre>"+JSON.stringify(r.d,null,2)+"</pre></div>":"<div class=err>"+r.d.error+"</div>"}async function showhealth(){var r=await c("GET","/api/health/DENIZ_001");if(r.ok){var h="<div class=card><h2>Health Records ("+r.d.length+")</h2>";for(var i=0;i<r.d.length;i++){h+="<p><b>"+r.d[i].parameter+"</b> "+r.d[i].value+" "+(r.d[i].unit||"")+" <small>"+r.d[i].verification_status+"</small></p>"}h+="</div>";$("main").innerHTML=h}else{$("main").innerHTML="<div class=err>"+r.d.error+"</div>"}}async function showtwin(){var r=await c("GET","/api/digital-twin/DENIZ_001");if(r.ok){var d=r.d;var h="<div class=card><h2>Digital Twin</h2>";if(d.health_summary){h+="<h3>Health</h3>";for(var k in d.health_summary){h+="<p><b>"+k+"</b> "+(d.health_summary[k].value||"")+" "+(d.health_summary[k].unit||"")+"</p>"}}if(d.lifestyle_summary){h+="<h3>Lifestyle</h3>";for(var k in d.lifestyle_summary){h+="<p><b>"+k+"</b> "+d.lifestyle_summary[k]+"</p>"}}h+="</div>";$("main").innerHTML=h}else{$("main").innerHTML="<div class=err>"+r.d.error+"</div>"}}async function showsim(){var h="<div class=card><h2>What If Simulation</h2><p>Adjust sleep:</p><input id=sl type=range min=4 max=10 step=0.25 value=5.75 style=width:100%><p id=slv>5.75 hours</p><button onclick=runsim()>Run</button><div id=sr></div></div>";$("main").innerHTML=h;$("sl").oninput=function(){$("slv").textContent=this.value+" hours"}}async function runsim(){var r=await c("POST","/api/simulation/run",{userId:"DENIZ_001",changes:{sleep:$("sl").value+"h"}});$("sr").innerHTML=r.ok?"<div class=ok>Simulation complete</div><pre>"+JSON.stringify(r.d,null,2)+"</pre>":"<div class=err>"+r.d.error+"</div>"}function shownfc(){$("main").innerHTML="<div class=card><h2>NFC Emergency Access</h2><p>Scan NFC card or enter UID:</p><input id=nu placeholder=NFC UID><button onclick=getnfc()>Lookup</button><div id=nr></div></div>"}async function getnfc(){var u=$("nu").value||"CARD_001";var r=await c("GET","/api/nfc/emergency-profile/"+u);$("nr").innerHTML=r.ok?"<div class=ok>Profile found</div><pre>"+JSON.stringify(r.d,null,2)+"</pre>":"<div class=err>"+r.d.error+"</div>"}if(T){showprofile()}else{showlogin()}</script></body></html>
